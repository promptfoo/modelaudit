name: Nightly CI

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Correctness (${{ matrix.os }}, Python ${{ matrix.python-version }}, Shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [0, 1, 2]
        exclude:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - &checkout-repo
        name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Pin Python version
        run: |
          uv python pin ${{ matrix.python-version }}

      - &install-rust-toolchain
        name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Sync dependencies
        id: sync
        run: |
          uv sync --extra ${{ matrix.os == 'windows-latest' && 'all-ci-windows' || 'all-ci' }}

      - name: Run correctness shard (fast + slow + integration)
        run: |
          uv run pytest -n auto -m "not performance" --modelaudit-shard-count 3 --modelaudit-shard-index ${{ matrix.shard }} --tb=short --durations=20

      - name: Capture ProcessProvider native diagnostic
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.shard == 0 && steps.sync.outcome == 'success' }}
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import importlib.metadata
          import importlib.util
          import json
          import platform
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          output = Path("picklescan-process-provider-diagnostic")
          output.mkdir(exist_ok=True)
          package = importlib.util.find_spec("modelaudit_picklescan")
          native = importlib.util.find_spec("modelaudit_picklescan._rust")
          assert package is not None and package.origin is not None
          assert native is not None and native.origin is not None
          binary = Path(native.origin).resolve(strict=True)
          assert binary.suffix == ".so"
          shutil.copy2(binary, output / binary.name)
          paths = subprocess.check_output(
              ["git", "ls-files", "packages/modelaudit-picklescan", "pyproject.toml", "uv.lock",
               "tests/conftest.py", ".github/workflows/nightly.yml"], text=True
          ).splitlines()
          manifest = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tracked_status": subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=no"], text=True
              ),
              "runtime": sys.version,
              "executable": sys.executable,
              "platform": platform.platform(),
              "package_origin": package.origin,
              "native_origin": str(binary),
              "native_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "tracked_input_sha256": {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths
              },
              "installed_versions": sorted(
                  (distribution.metadata["Name"], distribution.version)
                  for distribution in importlib.metadata.distributions()
              ),
          }
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload ProcessProvider native diagnostic
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.shard == 0 && steps.sync.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: picklescan-process-provider-native-${{ github.sha }}
          path: picklescan-process-provider-diagnostic/
          if-no-files-found: error
          retention-days: 7

  performance:
    name: Performance Tests (Python 3.11, single process)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout-repo

      - *install-uv

      - name: Pin Python version
        run: |
          uv python pin 3.11

      - *install-rust-toolchain

      - name: Sync dependencies
        run: |
          uv sync --extra all-ci

      - name: Run performance tests once without xdist
        run: |
          uv run pytest -n 0 -m performance --tb=short --durations=20

  picklescan-rust:
    name: Standalone Picklescan Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout-repo

      - *install-rust-toolchain

      - name: Run standalone picklescan Rust tests once
        run: |
          cargo test --manifest-path packages/modelaudit-picklescan/Cargo.toml

  nightly-success:
    name: Nightly Success
    needs: [correctness, performance, picklescan-rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Nightly lane to succeed
        env:
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PICKLESCAN_RUST_RESULT: ${{ needs.picklescan-rust.result }}
        run: |
          for result in "$CORRECTNESS_RESULT" "$PERFORMANCE_RESULT" "$PICKLESCAN_RUST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required Nightly lane did not succeed: $result"
              exit 1
            fi
          done
