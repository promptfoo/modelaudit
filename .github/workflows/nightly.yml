name: Nightly CI

on:
  pull_request:
    paths: [".github/workflows/nightly.yml"]
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    name: Correctness (${{ matrix.os }}, Python ${{ matrix.python-version }}, Shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        shard: [0, 1, 2]
        exclude:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - &checkout-repo
        name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Pin Python version
        run: |
          uv python pin ${{ matrix.python-version }}

      - &install-rust-toolchain
        name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # h5py 3.16 has no CPython 3.15 wheels. Exercise the explicit h5 extra on Linux.
      - name: Install HDF5 development libraries
        if: matrix.python-version == '3.15'
        run: |
          if ! pkg-config --exists hdf5; then
            sudo apt-get update
            sudo apt-get install -y libhdf5-dev
          fi

      - name: Sync dependencies
        id: sync
        run: >-
          uv sync --locked --extra ${{ matrix.os == 'windows-latest' && 'all-ci-windows' || 'all-ci' }}
          ${{ matrix.python-version == '3.15' && '--extra h5' || '' }}

      - name: Verify H5 import
        if: matrix.python-version == '3.15'
        run: uv run --no-sync python -c "import h5py; print(h5py.version.info)"

      - name: Run correctness shard (fast + slow + integration)
        run: |
          uv run --no-sync pytest -n auto -m "not performance" --modelaudit-shard-count 3 --modelaudit-shard-index ${{ matrix.shard }} --tb=short --durations=20

      - name: Capture ProcessProvider native diagnostic
        id: capture-native
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.shard == 0 && steps.sync.outcome == 'success' }}
        shell: bash
        run: .venv/bin/python scripts/capture_process_provider_diagnostic.py

      - name: Upload ProcessProvider native diagnostic
        if: ${{ always() && steps.capture-native.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: picklescan-process-provider-native-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/picklescan-process-provider-diagnostic/
          if-no-files-found: error
          retention-days: 7

  performance:
    name: Performance Tests (Python 3.11, single process)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout-repo

      - *install-uv

      - name: Pin Python version
        run: |
          uv python pin 3.11

      - *install-rust-toolchain

      - name: Sync dependencies
        run: |
          uv sync --locked --extra all-ci

      - name: Run performance tests once without xdist
        run: |
          uv run --no-sync pytest -n 0 -m performance --tb=short --durations=20

  picklescan-rust:
    name: Standalone Picklescan Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout-repo

      - *install-rust-toolchain

      - name: Run standalone picklescan Rust tests once
        run: |
          cargo test --manifest-path packages/modelaudit-picklescan/Cargo.toml

  nightly-success:
    name: Nightly Success
    needs: [correctness, performance, picklescan-rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Nightly lane to succeed
        env:
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PICKLESCAN_RUST_RESULT: ${{ needs.picklescan-rust.result }}
        run: |
          for result in "$CORRECTNESS_RESULT" "$PERFORMANCE_RESULT" "$PICKLESCAN_RUST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required Nightly lane did not succeed: $result"
              exit 1
            fi
          done
