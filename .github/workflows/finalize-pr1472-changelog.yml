name: Finalize PR 1472 changelog

on:
  push:
    branches:
      - mdangelo/codex/fix-dvc-output-limit-coverage-c085
    paths:
      - .github/workflows/finalize-pr1472-changelog.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Add active changelog entry and verify tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          heading = "### Bug Fixes\n\n"
          entry = "- fail closed when capped DVC pointer outputs are not otherwise covered, change during verification, exceed bounded tail verification, or exhaust shared scan budgets\n"
          assert entry not in text
          index = text.index(heading) + len(heading)
          path.write_text(text[:index] + entry + text[index:])
          PY

          git rm .github/workflows/finalize-pr1472-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          test "$(git write-tree)" = "bdb1508565b4230f77be162fc2670439861df6f9"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record capped DVC verification fix"
          git push origin HEAD:mdangelo/codex/fix-dvc-output-limit-coverage-c085
