name: Ruff Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv python pin 3.12
      - run: rustup toolchain install stable --profile minimal
      - run: uv sync --extra all-ci
      - name: Print Ruff diff
        run: |
          uv run ruff format modelaudit/scanners/jinja2_template_scanner.py tests/scanners/test_jinja2_template_scanner.py
          git diff -- modelaudit/scanners/jinja2_template_scanner.py tests/scanners/test_jinja2_template_scanner.py
