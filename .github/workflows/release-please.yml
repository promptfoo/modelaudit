name: release-please
run-name: modelaudit release by @${{ github.actor }}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - release-metadata-retry
  workflow_dispatch:
    inputs:
      root_version:
        description: "Publish an already-versioned root modelaudit release, for example 0.2.39"
        required: false
        type: string
      picklescan_version:
        description: "Publish an already-versioned modelaudit-picklescan release, for example 0.1.2"
        required: false
        type: string
      root_provenance_run_id:
        description: "Recover root provenance from the original verified publish run, for example 29787069929"
        required: false
        type: string

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.version || steps.release.outputs.version }}
      picklescan_release_created: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.picklescan_release_created || steps.release.outputs['packages/modelaudit-picklescan--release_created'] }}
      picklescan_tag_name: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.picklescan_tag_name || steps.release.outputs['packages/modelaudit-picklescan--tag_name'] }}
      picklescan_version: ${{ steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.picklescan_version || steps.release.outputs['packages/modelaudit-picklescan--version'] }}
      root_provenance_recovery: ${{ steps.manual.outputs.root_provenance_recovery }}
      root_provenance_run_id: ${{ steps.manual.outputs.root_provenance_run_id }}
      pr_number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
      pr_branch: ${{ steps.check-pr.outputs.pr_branch || '' }}
    steps:
      - name: Resolve manual release inputs
        id: manual
        env:
          ROOT_VERSION: ${{ github.event.inputs.root_version || '' }}
          PICKLESCAN_VERSION: ${{ github.event.inputs.picklescan_version || '' }}
          ROOT_PROVENANCE_RUN_ID: ${{ github.event.inputs.root_provenance_run_id || '' }}
        run: |
          if [[ -n "$ROOT_PROVENANCE_RUN_ID" ]]; then
            if [[ ! "$ROOT_PROVENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Root provenance recovery requires a numeric source run ID."
              exit 1
            fi
            if [[ ! "$ROOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Root provenance recovery requires root_version in X.Y.Z format."
              exit 1
            fi
            if [[ -n "$PICKLESCAN_VERSION" ]]; then
              echo "Root provenance recovery cannot publish modelaudit-picklescan."
              exit 1
            fi

            {
              echo "manual_release=true"
              echo "release_created=false"
              echo "picklescan_release_created=false"
              echo "root_provenance_recovery=true"
              echo "root_provenance_run_id=$ROOT_PROVENANCE_RUN_ID"
              echo "version=$ROOT_VERSION"
              echo "tag_name=v$ROOT_VERSION"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            if [[ -n "$ROOT_VERSION" ]]; then
              echo "release_created=true"
              echo "version=$ROOT_VERSION"
              echo "tag_name=v$ROOT_VERSION"
            else
              echo "release_created=false"
            fi

            if [[ -n "$PICKLESCAN_VERSION" ]]; then
              echo "picklescan_release_created=true"
              echo "picklescan_version=$PICKLESCAN_VERSION"
              echo "picklescan_tag_name=modelaudit-picklescan-v$PICKLESCAN_VERSION"
            else
              echo "picklescan_release_created=false"
            fi

            if [[ -n "$ROOT_VERSION" || -n "$PICKLESCAN_VERSION" ]]; then
              echo "manual_release=true"
            else
              echo "manual_release=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: steps.manual.outputs.manual_release != 'true' && github.event_name != 'repository_dispatch'
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure manual GitHub releases exist
        if: steps.manual.outputs.manual_release == 'true' && steps.manual.outputs.root_provenance_recovery != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT_TAG: ${{ steps.manual.outputs.tag_name }}
          ROOT_VERSION: ${{ steps.manual.outputs.version }}
          PICKLESCAN_TAG: ${{ steps.manual.outputs.picklescan_tag_name }}
          PICKLESCAN_VERSION: ${{ steps.manual.outputs.picklescan_version }}
        run: |
          if [[ -n "$ROOT_VERSION" ]] && ! gh release view "$ROOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ROOT_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$ROOT_TAG" \
              --notes "Manual recovery release for modelaudit $ROOT_VERSION."
          fi

          if [[ -n "$PICKLESCAN_VERSION" ]] && ! gh release view "$PICKLESCAN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PICKLESCAN_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "modelaudit-picklescan: v$PICKLESCAN_VERSION" \
              --notes "Manual recovery release for modelaudit-picklescan $PICKLESCAN_VERSION."
          fi

      - name: Check if PR exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OUTPUT: ${{ steps.release.outputs.pr || '' }}
          RETRY_EVENT: ${{ github.event.action || '' }}
          RETRY_BRANCH: ${{ github.event.client_payload.pr_branch || '' }}
        run: |
          if [[ -n "$PR_OUTPUT" && "$PR_OUTPUT" != "null" ]]; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$(jq -r '.headBranchName' <<< "$PR_OUTPUT")" >> "$GITHUB_OUTPUT"
          elif [[ "$RETRY_EVENT" == "release-metadata-retry" && "$RETRY_BRANCH" == "release-please--branches--main" ]]; then
            OPEN_BRANCH=$(gh pr view "$RETRY_BRANCH" --repo "$GITHUB_REPOSITORY" --json state,headRefName --jq 'if .state == "OPEN" then .headRefName else "" end')
            if [[ "$OPEN_BRANCH" != "$RETRY_BRANCH" ]]; then
              echo "Requested release metadata retry has no matching open release PR."
              exit 1
            fi
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$OPEN_BRANCH" >> "$GITHUB_OUTPUT"
          elif [[ "$RETRY_EVENT" == "release-metadata-retry" ]]; then
            echo "Refusing release metadata retry for an unexpected branch."
            exit 1
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          fi

  sync-release-metadata:
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record release metadata source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Rust toolchain for standalone lock refresh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Sync uv.lock with pyproject.toml
        run: uv lock

      - name: Sync standalone package lock with pyproject.toml
        working-directory: packages/modelaudit-picklescan
        run: |
          uv lock
          cargo update --workspace --manifest-path Cargo.toml
          cargo metadata --manifest-path Cargo.toml --locked --no-deps --format-version 1 >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Format changelogs with Prettier
        run: |
          echo "Formatting changelogs on branch: ${{ needs.release-please.outputs.pr_branch }}"
          npx prettier --write CHANGELOG.md packages/modelaudit-picklescan/CHANGELOG.md

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: modelaudit-release-metadata-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            uv.lock
            CHANGELOG.md
            packages/modelaudit-picklescan/uv.lock
            packages/modelaudit-picklescan/Cargo.lock
            packages/modelaudit-picklescan/CHANGELOG.md

  push-release-metadata:
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    needs: [release-please, sync-release-metadata]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download release metadata
        id: download-metadata
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modelaudit-release-metadata-${{ github.run_attempt }}
          path: /tmp/modelaudit-release-metadata

      - name: Regenerate missing release metadata
        if: steps.download-metadata.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          RETRY_EVENT: ${{ github.event.action || '' }}
        run: |
          if [[ "$RETRY_EVENT" == "release-metadata-retry" ]]; then
            echo "Release metadata is still unavailable after a fresh generation run; refusing to dispatch another retry."
            exit 1
          fi
          if [[ "$PR_BRANCH" != "release-please--branches--main" ]]; then
            echo "Refusing release metadata retry for an unexpected branch."
            exit 1
          fi
          echo "Release metadata is unavailable for this retry; starting a fresh read-only generation run."
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=release-metadata-retry -f "client_payload[pr_branch]=$PR_BRANCH"
          echo "Follow the new release-please run, or select Re-run all jobs to regenerate metadata."
          exit 1

      - name: Push release metadata updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          EXPECTED_HEAD: ${{ needs.sync-release-metadata.outputs.source_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ]]; then
            echo "Release branch changed while metadata was generated; refusing to overwrite newer changes."
            exit 1
          fi

          cp /tmp/modelaudit-release-metadata/uv.lock uv.lock
          cp /tmp/modelaudit-release-metadata/CHANGELOG.md CHANGELOG.md
          cp /tmp/modelaudit-release-metadata/packages/modelaudit-picklescan/uv.lock packages/modelaudit-picklescan/uv.lock
          cp /tmp/modelaudit-release-metadata/packages/modelaudit-picklescan/Cargo.lock packages/modelaudit-picklescan/Cargo.lock
          cp /tmp/modelaudit-release-metadata/packages/modelaudit-picklescan/CHANGELOG.md packages/modelaudit-picklescan/CHANGELOG.md

          if git diff --quiet uv.lock CHANGELOG.md packages/modelaudit-picklescan/uv.lock packages/modelaudit-picklescan/Cargo.lock packages/modelaudit-picklescan/CHANGELOG.md; then
            echo "✓ Release metadata already in sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock CHANGELOG.md packages/modelaudit-picklescan/uv.lock packages/modelaudit-picklescan/Cargo.lock packages/modelaudit-picklescan/CHANGELOG.md
          git commit -m "chore: sync release metadata"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_BRANCH}"

  build:
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Type check root package with mypy
        run: |
          # Match tool.mypy.python_version so version-gated dependency stubs use valid syntax.
          uv sync --python 3.10 --locked --extra all-ci
          uv run --python 3.10 --locked mypy modelaudit/ tests/
          uv cache prune --ci

      - name: Sync dependencies for root runtime checks
        run: |
          # Keep the release security tests and artifact smoke tests on modern Python.
          uv python pin 3.12
          uv sync --locked --extra all-ci

      - name: Lint root package with Ruff
        run: uv run ruff check modelaudit/ tests/

      - name: Check root package formatting with Ruff
        run: uv run ruff format --check modelaudit/ tests/

      - name: Run root package tests
        run: |
          uv run pytest tests -n auto -m "not slow and not integration and not performance" --tb=short

      - name: Build package
        run: uv build

      - name: Build standalone pickle package for smoke installs
        run: uv build packages/modelaudit-picklescan --out-dir /tmp/modelaudit-picklescan-dist

      - name: Verify distribution artifacts and version consistency
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.release-please.outputs.version }}"

          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)

          echo "Built artifacts:"
          ls -la dist/

          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 wheel artifact, found ${#wheels[@]}"
            exit 1
          fi

          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 sdist artifact, found ${#sdists[@]}"
            exit 1
          fi

          WHEEL_PATH="${wheels[0]}"
          SDIST_PATH="${sdists[0]}"
          WHEEL_FILE="$(basename "${WHEEL_PATH}")"
          SDIST_FILE="$(basename "${SDIST_PATH}")"

          # Extract versions from package metadata, not filenames.
          WHEEL_VERSION="$(
            python - "${WHEEL_PATH}" <<'PY'
          import sys
          import zipfile

          wheel_path = sys.argv[1]
          with zipfile.ZipFile(wheel_path) as zf:
              metadata_files = [name for name in zf.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit(f"Expected exactly one wheel METADATA file, found {len(metadata_files)}")
              metadata_text = zf.read(metadata_files[0]).decode("utf-8", errors="replace")

          for line in metadata_text.splitlines():
              if line.startswith("Version: "):
                  print(line.split(":", 1)[1].strip())
                  break
          else:
              raise SystemExit("Could not find Version header in wheel METADATA")
          PY
          )"

          SDIST_VERSION="$(
            python - "${SDIST_PATH}" <<'PY'
          import sys
          import tarfile

          sdist_path = sys.argv[1]
          with tarfile.open(sdist_path, "r:gz") as tf:
              pkg_info_files = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO")]
              if len(pkg_info_files) != 1:
                  raise SystemExit(f"Expected exactly one PKG-INFO file in sdist, found {len(pkg_info_files)}")
              file_obj = tf.extractfile(pkg_info_files[0])
              if file_obj is None:
                  raise SystemExit("Failed to read PKG-INFO from sdist")
              pkg_info_text = file_obj.read().decode("utf-8", errors="replace")

          for line in pkg_info_text.splitlines():
              if line.startswith("Version: "):
                  print(line.split(":", 1)[1].strip())
                  break
          else:
              raise SystemExit("Could not find Version header in sdist PKG-INFO")
          PY
          )"

          if [[ "$WHEEL_VERSION" != "$EXPECTED_VERSION" || "$SDIST_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Artifact versions do not match expected release version"
            echo "Expected version: $EXPECTED_VERSION"
            echo "Wheel version: $WHEEL_VERSION ($WHEEL_FILE)"
            echo "sdist version: $SDIST_VERSION ($SDIST_FILE)"
            exit 1
          fi

          echo "Artifact validation passed for version ${EXPECTED_VERSION}"

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Smoke test wheel install in clean environment
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.release-please.outputs.version }}"

          shopt -s nullglob
          wheel_artifacts=(dist/modelaudit-*.whl)
          if [[ ${#wheel_artifacts[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 wheel artifact for install smoke test, found ${#wheel_artifacts[@]}"
            ls -la dist/
            exit 1
          fi
          WHEEL_ARTIFACT="${wheel_artifacts[0]}"

          uv venv /tmp/modelaudit-wheel-smoke

          uv pip install \
            --python /tmp/modelaudit-wheel-smoke/bin/python \
            --find-links /tmp/modelaudit-picklescan-dist \
            "${WHEEL_ARTIFACT}"

          INSTALLED_VERSION="$(
            /tmp/modelaudit-wheel-smoke/bin/python -c "import importlib.metadata as m; print(m.version('modelaudit'))"
          )"
          if [[ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Wheel install version mismatch: expected $EXPECTED_VERSION, got $INSTALLED_VERSION"
            exit 1
          fi

          # Validate required project URLs in installed metadata.
          /tmp/modelaudit-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as md

          # Keep these expected URLs in sync with [project.urls] in pyproject.toml.
          required = {
              "Bug Tracker": "https://github.com/promptfoo/modelaudit/issues",
              "Changelog": "https://github.com/promptfoo/modelaudit/blob/main/CHANGELOG.md",
          }

          project_urls = md.metadata("modelaudit").get_all("Project-URL") or []
          parsed = {}
          for entry in project_urls:
              if "," in entry:
                  label, url = entry.split(",", 1)
                  parsed[label.strip()] = url.strip()

          missing = [label for label in required if label not in parsed]
          mismatched = [label for label, expected in required.items() if parsed.get(label) != expected]
          if missing or mismatched:
              raise SystemExit(
                  f"Project URL metadata invalid. missing={missing}, mismatched={mismatched}, parsed={parsed}"
              )
          print("Project URL metadata validated.")
          PY

          /tmp/modelaudit-wheel-smoke/bin/modelaudit --version

          /tmp/modelaudit-wheel-smoke/bin/python - <<'PY'
          import modelaudit_picklescan

          report = modelaudit_picklescan.scan_bytes(b"\x80\x04}q\x00.")
          assert report.status.value == "complete", report
          print("modelaudit_picklescan import and scan smoke test passed.")
          PY

          # Basic CLI smoke run from the installed wheel.
          /tmp/modelaudit-wheel-smoke/bin/python - <<'PY'
          import pathlib
          import pickle
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="modelaudit-wheel-smoke-") as tmpdir:
              test_dir = pathlib.Path(tmpdir)
              test_file = test_dir / "smoke.pkl"
              with test_file.open("wb") as f:
                  pickle.dump({"smoke": True}, f)

              completed = subprocess.run(
                  ["/tmp/modelaudit-wheel-smoke/bin/modelaudit", str(test_file), "--format", "json"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              print(completed.stdout)
              if completed.returncode not in (0, 1):
                  raise SystemExit(f"Unexpected modelaudit exit code during wheel smoke test: {completed.returncode}")
          PY

      - name: Smoke test sdist install in clean environment
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.release-please.outputs.version }}"

          shopt -s nullglob
          sdist_artifacts=(dist/modelaudit-*.tar.gz)
          if [[ ${#sdist_artifacts[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 sdist artifact for install smoke test, found ${#sdist_artifacts[@]}"
            ls -la dist/
            exit 1
          fi
          SDIST_ARTIFACT="${sdist_artifacts[0]}"

          uv venv /tmp/modelaudit-sdist-smoke

          uv pip install \
            --python /tmp/modelaudit-sdist-smoke/bin/python \
            --find-links /tmp/modelaudit-picklescan-dist \
            "${SDIST_ARTIFACT}"

          INSTALLED_VERSION="$(
            /tmp/modelaudit-sdist-smoke/bin/python -c "import importlib.metadata as m; print(m.version('modelaudit'))"
          )"
          if [[ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: sdist install version mismatch: expected $EXPECTED_VERSION, got $INSTALLED_VERSION"
            exit 1
          fi

          /tmp/modelaudit-sdist-smoke/bin/modelaudit --version

          /tmp/modelaudit-sdist-smoke/bin/python - <<'PY'
          import modelaudit_picklescan

          report = modelaudit_picklescan.scan_bytes(b"\x80\x04}q\x00.")
          assert report.status.value == "complete", report
          print("modelaudit_picklescan import and scan smoke test passed.")
          PY

          # Basic CLI smoke run from the installed sdist.
          /tmp/modelaudit-sdist-smoke/bin/python - <<'PY'
          import pathlib
          import pickle
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="modelaudit-sdist-smoke-") as tmpdir:
              test_dir = pathlib.Path(tmpdir)
              test_file = test_dir / "smoke.pkl"
              with test_file.open("wb") as f:
                  pickle.dump({"smoke": True}, f)

              completed = subprocess.run(
                  ["/tmp/modelaudit-sdist-smoke/bin/modelaudit", str(test_file), "--format", "json"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              print(completed.stdout)
              if completed.returncode not in (0, 1):
                  raise SystemExit(f"Unexpected modelaudit exit code during sdist smoke test: {completed.returncode}")
          PY

      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  build-picklescan-package:
    if: needs.release-please.outputs.picklescan_release_created == 'true'
    name: Build standalone pickle package (${{ matrix.artifact-suffix }})
    runs-on: ${{ matrix.os }}
    needs: release-please
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
            build-sdist: "true"
          - os: macos-14
            artifact-suffix: macos-arm64
            build-sdist: "false"
          - os: macos-15-intel
            artifact-suffix: macos-x86_64
            build-sdist: "false"
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
            build-sdist: "false"
          - os: windows-latest
            artifact-suffix: windows
            build-sdist: "false"
    defaults:
      run:
        shell: bash
        working-directory: packages/modelaudit-picklescan
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Pin Python version
        run: |
          uv python pin 3.12

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/modelaudit-picklescan/target
          key: ${{ runner.os }}-cargo-picklescan-${{ hashFiles('packages/modelaudit-picklescan/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-picklescan-

      - name: Check standalone package lock is in sync
        run: |
          uv lock --check

      - name: Check Rust scanner formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Check Rust scanner crate
        run: cargo check --manifest-path Cargo.toml

      - name: Lint Rust scanner crate
        run: cargo clippy --manifest-path Cargo.toml --all-targets -- -D warnings

      - name: Test Rust scanner crate
        run: |
          cargo test --manifest-path Cargo.toml

      - name: Lint standalone package with Ruff
        run: uv run --with ruff ruff check src tests

      - name: Check standalone package formatting with Ruff
        run: uv run --with ruff ruff format --check src tests

      - name: Type check standalone package with mypy
        run: uv run --with mypy mypy src tests

      - name: Run standalone package tests
        run: uv run --with pytest --with pytest-xdist pytest -n auto tests --tb=short

      - name: Build standalone package sdist
        if: matrix.build-sdist == 'true'
        run: |
          uv build --sdist --out-dir dist

      - name: Build standalone package manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist
          manylinux: "2_28"
          working-directory: packages/modelaudit-picklescan

      - name: Build standalone package wheel
        if: runner.os != 'Linux'
        run: |
          uv build --wheel --out-dir dist

      - name: Validate standalone package metadata
        run: uvx twine check dist/*

      - name: Verify standalone artifact version consistency
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.release-please.outputs.picklescan_version }}"

          shopt -s nullglob
          artifacts=(dist/modelaudit_picklescan-*.whl dist/modelaudit_picklescan-*.tar.gz)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "ERROR: Expected at least one modelaudit_picklescan artifact"
            ls -la dist/
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            ARTIFACT_VERSION="$(
              python - "${artifact}" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          artifact_path = Path(sys.argv[1])
          if artifact_path.suffix == ".whl":
              with zipfile.ZipFile(artifact_path) as zf:
                  metadata_files = [name for name in zf.namelist() if name.endswith(".dist-info/METADATA")]
                  if len(metadata_files) != 1:
                      raise SystemExit(f"Expected one wheel METADATA file, found {len(metadata_files)}")
                  metadata_text = zf.read(metadata_files[0]).decode("utf-8", errors="replace")
          elif artifact_path.name.endswith(".tar.gz"):
              with tarfile.open(artifact_path, "r:gz") as tf:
                  pkg_info_files = [member for member in tf.getmembers() if member.name.endswith("/PKG-INFO")]
                  if len(pkg_info_files) != 1:
                      raise SystemExit(f"Expected one PKG-INFO file, found {len(pkg_info_files)}")
                  file_obj = tf.extractfile(pkg_info_files[0])
                  if file_obj is None:
                      raise SystemExit("Failed to read PKG-INFO from sdist")
                  metadata_text = file_obj.read().decode("utf-8", errors="replace")
          else:
              raise SystemExit(f"Unsupported artifact type: {artifact_path}")

          for line in metadata_text.splitlines():
              if line.startswith("Version: "):
                  print(line.split(":", 1)[1].strip())
                  break
          else:
              raise SystemExit("Could not find Version header")
          PY
            )"

            if [[ "$ARTIFACT_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "ERROR: Artifact version mismatch for ${artifact}"
              echo "Expected version: $EXPECTED_VERSION"
              echo "Artifact version: $ARTIFACT_VERSION"
              exit 1
            fi
          done

          echo "Standalone artifact validation passed for version ${EXPECTED_VERSION}"

      - name: Smoke test standalone package wheel install
        run: |
          set -euo pipefail
          uv venv /tmp/modelaudit-picklescan-wheel-smoke
          if [[ -x /tmp/modelaudit-picklescan-wheel-smoke/bin/python ]]; then
            SMOKE_PYTHON=/tmp/modelaudit-picklescan-wheel-smoke/bin/python
          else
            SMOKE_PYTHON=/tmp/modelaudit-picklescan-wheel-smoke/Scripts/python.exe
          fi

          shopt -s nullglob
          picklescan_wheels=(dist/modelaudit_picklescan-*.whl)
          if [[ ${#picklescan_wheels[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 modelaudit_picklescan wheel artifact, found ${#picklescan_wheels[@]}"
            ls -la dist/
            exit 1
          fi

          uv pip install --python "$SMOKE_PYTHON" "${picklescan_wheels[0]}"

          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            PYTHONPATH='' "$SMOKE_PYTHON" -I - <<'PY'
          import importlib.util

          import modelaudit_picklescan

          assert importlib.util.find_spec("modelaudit") is None
          assert importlib.util.find_spec("modelaudit_picklescan._rust") is not None
          report = modelaudit_picklescan.scan_bytes(b"\x80\x04}q\x00.")
          assert report.status.value == "complete", report
          assert report.verdict.value == "clean", report
          assert not any(notice.code == "engine_fallback" for notice in report.notices)
          print("standalone modelaudit_picklescan wheel loaded without modelaudit")
          PY
          )

      - name: Upload standalone package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: modelaudit-picklescan-dist-${{ matrix.artifact-suffix }}
          path: packages/modelaudit-picklescan/dist/

  publish-pypi:
    if: >-
      ${{
        always() &&
        needs.release-please.outputs.release_created == 'true' &&
        needs.build.result == 'success' &&
        (
          needs.release-please.outputs.picklescan_release_created != 'true' ||
          needs.verify-picklescan-pypi.result == 'success'
        )
      }}
    needs: [build, release-please, verify-picklescan-pypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modelaudit/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Verify the root picklescan dependency is available on PyPI
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          wheels = list(Path("dist").glob("modelaudit-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one modelaudit wheel, found: {wheels}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit(f"Expected one wheel METADATA file, found: {metadata_files}")
              metadata = Parser().parsestr(archive.read(metadata_files[0]).decode())

          requirements = metadata.get_all("Requires-Dist") or []
          picklescan_requirements = [
              requirement.split(";", 1)[0].strip()
              for requirement in requirements
              if re.match(r"^modelaudit[-_]picklescan\b", requirement, re.IGNORECASE)
          ]
          if len(picklescan_requirements) != 1:
              raise SystemExit(f"Expected one modelaudit-picklescan requirement, found: {picklescan_requirements}")

          requirement = picklescan_requirements[0]
          constraint = re.sub(r"^modelaudit[-_]picklescan", "", requirement, count=1, flags=re.IGNORECASE)
          constraint = constraint.strip().removeprefix("(").removesuffix(")").replace(" ", "")
          if not re.fullmatch(r"(?:==|!=|>=|<=|>|<)[0-9]+(?:\.[0-9]+){1,2}(?:,(?:==|!=|>=|<=|>|<)[0-9]+(?:\.[0-9]+){1,2})*", constraint):
              raise SystemExit(f"Unsupported modelaudit-picklescan requirement: {requirement}")
          specifiers = re.findall(r"(==|!=|>=|<=|>|<)([0-9]+(?:\.[0-9]+){1,2})", constraint)

          def version_parts(value):
              parts = tuple(int(part) for part in value.split("."))
              return parts + (0,) * (3 - len(parts))

          def published_version_parts(value):
              match = re.fullmatch(r"([0-9]+(?:\.[0-9]+){1,2})(?:\.post([0-9]+))?", value)
              if match is None:
                  return None
              post = int(match[2]) if match[2] is not None else -1
              return version_parts(match[1]) + (post,)

          def matches(version):
              comparisons = {
                  "==": lambda left, right: left == right,
                  "!=": lambda left, right: left != right,
                  ">=": lambda left, right: left >= right,
                  "<=": lambda left, right: left <= right,
                  ">": lambda left, right: left > right,
                  "<": lambda left, right: left < right,
              }
              for operator, value in specifiers:
                  target = version_parts(value) + (-1,)
                  if operator == ">" and version[:3] == target[:3]:
                      return False
                  if not comparisons[operator](version, target):
                      return False
              return True

          url = "https://pypi.org/pypi/modelaudit-picklescan/json"
          deadline = time.monotonic() + 600
          last_status = "not checked"

          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      releases = json.load(response).get("releases", {})
                  compatible = []
                  for version, files in releases.items():
                      published_version = published_version_parts(version)
                      if published_version is None or not matches(published_version):
                          continue
                      filenames = {entry["filename"] for entry in files if not entry.get("yanked", False)}
                      expected_files = {
                          f"modelaudit_picklescan-{version}-cp310-abi3-macosx_10_12_x86_64.whl",
                          f"modelaudit_picklescan-{version}-cp310-abi3-macosx_11_0_arm64.whl",
                          f"modelaudit_picklescan-{version}-cp310-abi3-manylinux_2_28_aarch64.whl",
                          f"modelaudit_picklescan-{version}-cp310-abi3-manylinux_2_28_x86_64.whl",
                          f"modelaudit_picklescan-{version}-cp310-abi3-win_amd64.whl",
                          f"modelaudit_picklescan-{version}.tar.gz",
                      }
                      if expected_files <= filenames:
                          compatible.append(version)
                  if compatible:
                      print(f"PyPI has compatible modelaudit-picklescan releases for {requirement}: {compatible}")
                      break
                  last_status = f"no complete, non-yanked release satisfies {requirement}"
              except Exception as exc:
                  last_status = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"Refusing to publish modelaudit with an unavailable picklescan dependency: {last_status}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          print-hash: true
          attestations: true

  publish-picklescan-pypi:
    if: needs.release-please.outputs.picklescan_release_created == 'true'
    needs: [build-picklescan-package, release-please]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modelaudit-picklescan/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download standalone pickle package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: modelaudit-picklescan-dist-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          print-hash: true
          attestations: true

  verify-picklescan-pypi:
    if: needs.release-please.outputs.picklescan_release_created == 'true'
    needs: [publish-picklescan-pypi, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.release-please.outputs.picklescan_version }}
    steps:
      - name: Wait for modelaudit-picklescan files on PyPI
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          import time
          import urllib.request
          import zlib

          version = os.environ["EXPECTED_VERSION"]
          expected_files = {
              f"modelaudit_picklescan-{version}-cp310-abi3-macosx_10_12_x86_64.whl",
              f"modelaudit_picklescan-{version}-cp310-abi3-macosx_11_0_arm64.whl",
              f"modelaudit_picklescan-{version}-cp310-abi3-manylinux_2_28_aarch64.whl",
              f"modelaudit_picklescan-{version}-cp310-abi3-manylinux_2_28_x86_64.whl",
              f"modelaudit_picklescan-{version}-cp310-abi3-win_amd64.whl",
              f"modelaudit_picklescan-{version}.tar.gz",
          }
          url = f"https://pypi.org/pypi/modelaudit-picklescan/{version}/json"
          simple_url = "https://pypi.org/simple/modelaudit-picklescan/"
          deadline = time.monotonic() + 600
          last_status = "not checked"

          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  request = urllib.request.Request(
                      simple_url,
                      headers={
                          "Accept": "application/vnd.pypi.simple.v1+json, application/vnd.pypi.simple.v1+html; q=0.1, text/html; q=0.01",
                          "Accept-Encoding": "gzip, deflate",
                          "Cache-Control": "max-age=0",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      simple_body = response.read()
                      content_encoding = response.headers.get("Content-Encoding", "identity").lower()
                  if content_encoding == "gzip":
                      simple_body = gzip.decompress(simple_body)
                  elif content_encoding == "deflate":
                      simple_body = zlib.decompress(simple_body)
                  elif content_encoding not in ("", "identity"):
                      raise ValueError(f"Unsupported Simple API Content-Encoding: {content_encoding!r}")
                  simple_payload = json.loads(simple_body)
                  filenames = {entry["filename"] for entry in payload.get("urls", [])}
                  simple_filenames = {
                      entry["filename"] for entry in simple_payload.get("files", []) if not entry.get("yanked", False)
                  }
                  missing = sorted(expected_files - filenames)
                  missing_simple = sorted(expected_files - simple_filenames)
                  info_version = payload.get("info", {}).get("version")
                  if info_version == version and not missing and not missing_simple:
                      print(f"PyPI has modelaudit-picklescan {version}: {sorted(filenames)}")
                      break
                  last_status = f"version={info_version!r}, missing={missing}, missing_simple={missing_simple}"
              except Exception as exc:
                  last_status = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"Timed out waiting for modelaudit-picklescan {version} on PyPI: {last_status}")
          PY

      - name: Install published modelaudit-picklescan and smoke test API
        run: |
          set -euo pipefail
          python -m venv /tmp/modelaudit-picklescan-pypi-smoke
          /tmp/modelaudit-picklescan-pypi-smoke/bin/python -m pip install --upgrade pip
          /tmp/modelaudit-picklescan-pypi-smoke/bin/python -m pip install \
            --no-cache-dir \
            --retries 10 \
            --timeout 60 \
            "modelaudit-picklescan==${EXPECTED_VERSION}"

          /tmp/modelaudit-picklescan-pypi-smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import os
          import pickle

          import modelaudit_picklescan

          expected_version = os.environ["EXPECTED_VERSION"]
          installed_version = md.version("modelaudit-picklescan")
          if installed_version != expected_version:
              raise SystemExit(f"Expected modelaudit-picklescan {expected_version}, got {installed_version}")
          if importlib.util.find_spec("modelaudit_picklescan._rust") is None:
              raise SystemExit("modelaudit_picklescan._rust extension was not installed")

          clean_report = modelaudit_picklescan.scan_bytes(pickle.dumps({"weights": [1, 2, 3]}, protocol=4))
          if clean_report.status.value != "complete" or clean_report.verdict.value != "clean":
              raise SystemExit(f"Expected clean complete report, got {clean_report}")

          class MaliciousPayload:
              def __reduce__(self):
                  return (os.system, ("echo modelaudit-picklescan-smoke",))

          malicious_report = modelaudit_picklescan.scan_bytes(
              pickle.dumps(MaliciousPayload(), protocol=4),
              source="malicious.pkl",
          )
          if malicious_report.status.value != "complete" or malicious_report.verdict.value != "malicious":
              raise SystemExit(f"Expected malicious complete report, got {malicious_report}")
          if not any(finding.rule_code == "DANGEROUS_CALL" for finding in malicious_report.findings):
              raise SystemExit(f"Expected DANGEROUS_CALL finding, got {malicious_report.findings}")

          print("Published modelaudit-picklescan API smoke test passed.")
          PY

  verify-pypi:
    if: >-
      ${{
        always() &&
        needs.release-please.outputs.release_created == 'true' &&
        needs.publish-pypi.result == 'success' &&
        (
          needs.release-please.outputs.picklescan_release_created != 'true' ||
          needs.verify-picklescan-pypi.result == 'success'
        )
      }}
    needs:
      [
        publish-pypi,
        publish-picklescan-pypi,
