      EXPECTED_PICKLESCAN_VERSION: ${{ needs.release-please.outputs.picklescan_version }}
      PICKLESCAN_RELEASE_CREATED: ${{ needs.release-please.outputs.picklescan_release_created }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - name: Wait for modelaudit files on PyPI
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          import time
          import urllib.request
          import zlib

          version = os.environ["EXPECTED_VERSION"]
          expected_files = {
              f"modelaudit-{version}-py3-none-any.whl",
              f"modelaudit-{version}.tar.gz",
          }
          url = f"https://pypi.org/pypi/modelaudit/{version}/json"
          simple_url = "https://pypi.org/simple/modelaudit/"
          deadline = time.monotonic() + 600
          last_status = "not checked"

          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  request = urllib.request.Request(
                      simple_url,
                      headers={
                          "Accept": "application/vnd.pypi.simple.v1+json, application/vnd.pypi.simple.v1+html; q=0.1, text/html; q=0.01",
                          "Accept-Encoding": "gzip, deflate",
                          "Cache-Control": "max-age=0",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      simple_body = response.read()
                      content_encoding = response.headers.get("Content-Encoding", "identity").lower()
                  if content_encoding == "gzip":
                      simple_body = gzip.decompress(simple_body)
                  elif content_encoding == "deflate":
                      simple_body = zlib.decompress(simple_body)
                  elif content_encoding not in ("", "identity"):
                      raise ValueError(f"Unsupported Simple API Content-Encoding: {content_encoding!r}")
                  simple_payload = json.loads(simple_body)
                  filenames = {entry["filename"] for entry in payload.get("urls", [])}
                  simple_filenames = {
                      entry["filename"] for entry in simple_payload.get("files", []) if not entry.get("yanked", False)
                  }
                  missing = sorted(expected_files - filenames)
                  missing_simple = sorted(expected_files - simple_filenames)
                  info_version = payload.get("info", {}).get("version")
                  if info_version == version and not missing and not missing_simple:
                      print(f"PyPI has modelaudit {version}: {sorted(filenames)}")
                      break
                  last_status = f"version={info_version!r}, missing={missing}, missing_simple={missing_simple}"
              except Exception as exc:
                  last_status = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"Timed out waiting for modelaudit {version} on PyPI: {last_status}")
          PY

      - name: Install published modelaudit and run end-to-end smoke tests
        run: |
          set -euo pipefail
          python -m venv /tmp/modelaudit-pypi-smoke
          /tmp/modelaudit-pypi-smoke/bin/python -m pip install --upgrade pip
          /tmp/modelaudit-pypi-smoke/bin/python -m pip install \
            --no-cache-dir \
            --retries 10 \
            --timeout 60 \
            "modelaudit[all]==${EXPECTED_VERSION}"

          /tmp/modelaudit-pypi-smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import json
          import os
          import pickle
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          expected_version = os.environ["EXPECTED_VERSION"]
          installed_version = md.version("modelaudit")
          if installed_version != expected_version:
              raise SystemExit(f"Expected modelaudit {expected_version}, got {installed_version}")

          picklescan_version = md.version("modelaudit-picklescan")
          expected_picklescan_version = os.environ.get("EXPECTED_PICKLESCAN_VERSION")
          if os.environ.get("PICKLESCAN_RELEASE_CREATED") == "true" and expected_picklescan_version:
              if picklescan_version != expected_picklescan_version:
                  raise SystemExit(
                      "Expected coordinated picklescan "
                      f"{expected_picklescan_version}, got {picklescan_version}"
                  )
          print(f"Installed modelaudit {installed_version} with modelaudit-picklescan {picklescan_version}.")

          modelaudit = Path("/tmp/modelaudit-pypi-smoke/bin/modelaudit")
          env = os.environ.copy()
          env["PROMPTFOO_DISABLE_TELEMETRY"] = "1"

          def run(args: list[str | Path], expected_returncode: int) -> subprocess.CompletedProcess[str]:
              command = [str(arg) for arg in args]
              print("$", " ".join(command))
              completed = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  env=env,
                  check=False,
              )
              if completed.stdout:
                  print(completed.stdout)
              if completed.stderr:
                  print(completed.stderr)
              if completed.returncode != expected_returncode:
                  raise SystemExit(
                      f"Expected exit {expected_returncode} from {' '.join(command)}, "
                      f"got {completed.returncode}"
                  )
              return completed

          run([modelaudit, "--version"], 0)
          run([modelaudit, "doctor", "--show-failed"], 0)

          with tempfile.TemporaryDirectory(prefix="modelaudit-pypi-smoke-") as tmpdir:
              workdir = Path(tmpdir)
              marker = workdir / "payload-executed"
              benign = workdir / "benign.pkl"
              malicious = workdir / "malicious.pkl"
              malicious_zip = workdir / "malicious.zip"

              with benign.open("wb") as handle:
                  pickle.dump({"weights": [1.0, 2.0, 3.0], "metadata": {"name": "release-smoke"}}, handle)

              class MaliciousPayload:
                  def __reduce__(self):
                      return (os.system, (f"touch {marker}",))

              with malicious.open("wb") as handle:
                  pickle.dump(MaliciousPayload(), handle, protocol=4)
              with zipfile.ZipFile(malicious_zip, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.write(malicious, arcname="malicious.pkl")

              benign_json = workdir / "benign.json"
              malicious_json = workdir / "malicious.json"
              zip_json = workdir / "malicious-zip.json"
              sarif_json = workdir / "malicious.sarif"
              sbom_json = workdir / "sbom.json"

              run([modelaudit, "scan", benign, "--format", "json", "--output", benign_json, "--no-cache"], 0)
              run([modelaudit, "scan", malicious, "--format", "json", "--output", malicious_json, "--no-cache"], 1)
              run([modelaudit, "scan", malicious_zip, "--format", "json", "--output", zip_json, "--no-cache"], 1)
              run(
                  [
                      modelaudit,
                      "scan",
                      malicious,
                      "--format",
                      "sarif",
                      "--output",
                      sarif_json,
                      "--sbom",
                      sbom_json,
                      "--no-cache",
                  ],
                  1,
              )

              if marker.exists():
                  raise SystemExit("Malicious pickle payload executed during scan")

              benign_report = json.loads(benign_json.read_text())
              if benign_report.get("issues") or benign_report.get("failed_checks") != 0:
                  raise SystemExit(f"Expected benign pickle to be clean, got {benign_report}")

              for report_path in (malicious_json, zip_json):
                  report = json.loads(report_path.read_text())
                  if not any(
                      issue.get("rule_code") == "S201" and issue.get("severity") == "critical"
                      for issue in report.get("issues", [])
                  ):
                      raise SystemExit(f"Expected critical S201 in {report_path}, got {report}")

              sarif_report = json.loads(sarif_json.read_text())
              sarif_results = sarif_report.get("runs", [{}])[0].get("results", [])
              if sarif_report.get("version") != "2.1.0" or not any(
                  result.get("ruleId") == "S201" for result in sarif_results
              ):
                  raise SystemExit(f"Expected SARIF S201 result, got {sarif_report}")

              sbom_report = json.loads(sbom_json.read_text())
              if sbom_report.get("bomFormat") != "CycloneDX" or not sbom_report.get("components"):
                  raise SystemExit(f"Expected CycloneDX SBOM with components, got {sbom_report}")

          print("Published modelaudit end-to-end smoke test passed.")
          PY

  provenance:
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.release-please.outputs.release_created == 'true' &&
        needs.build.result == 'success' &&
        needs.publish-pypi.result == 'success' &&
        needs.verify-pypi.result == 'success'
      }}
    needs: [build, publish-pypi, verify-pypi, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            pyproject.toml
            uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "dist/*"

      - name: Generate SBOM
        run: |
          uv export \
            --frozen \
            --no-dev \
            --preview-features sbom-export \
            --format cyclonedx1.5 \
            --output-file dist/modelaudit-${{ needs.release-please.outputs.version }}.cdx.json \
            > /dev/null
          echo "SBOM generated:"
          ls -la dist/*.cdx.json

      # Upload wheel/sdist and SBOM to the GitHub Release as an alternative
      # download location alongside PyPI. --clobber ensures idempotency on re-runs.
      - name: Upload build artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --clobber

  root-provenance-recovery:
    if: >-
      ${{
        !cancelled() &&
        needs.release-please.result == 'success' &&
        needs.release-please.outputs.root_provenance_recovery == 'true'
      }}
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged root release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          sparse-checkout: |
            pyproject.toml
            uv.lock
          persist-credentials: false

      - name: Verify original root publish run
        id: verify-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.release-please.outputs.root_provenance_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Root provenance recovery requires a numeric source run ID."
            exit 1
          fi

          tag_commit_sha=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ ! "$tag_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Root provenance recovery requires a valid tagged commit SHA."
            exit 1
          fi

          run_metadata=$(mktemp)
          jobs_metadata=$(mktemp)
          repository_metadata=$(mktemp)
          compare_metadata=$(mktemp)
          tag_compare_metadata=$(mktemp)
          source_relation_metadata=$(mktemp)
          trap 'rm -f "$run_metadata" "$jobs_metadata" "$repository_metadata" "$compare_metadata" "$tag_compare_metadata" "$source_relation_metadata"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$run_metadata"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > "$jobs_metadata"
          gh api "repos/${GITHUB_REPOSITORY}" > "$repository_metadata"
          export RUN_METADATA="$run_metadata"
          export JOBS_METADATA="$jobs_metadata"
          export REPOSITORY_METADATA="$repository_metadata"

          source_head_sha=$(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          run = json.loads(Path(os.environ["RUN_METADATA"]).read_text(encoding="utf-8"))
          if not isinstance(run, dict):
              raise SystemExit(f"Source run {source_run_id} returned invalid run metadata")
          if run.get("path") != ".github/workflows/release-please.yml":
              raise SystemExit(f"Source run {source_run_id} is not a release-please workflow run")
          if run.get("event") not in {"push", "workflow_dispatch"}:
              raise SystemExit(f"Source run {source_run_id} has an unsupported event: {run.get('event')!r}")
          if run.get("status") != "completed" or run.get("conclusion") not in {"success", "failure"}:
              raise SystemExit(f"Source run {source_run_id} did not complete with a supported conclusion")
          source_repository = run.get("repository")
          if not isinstance(source_repository, dict) or source_repository.get("full_name") != repository:
              raise SystemExit(f"Source run {source_run_id} belongs to a different repository")
          repository_metadata = json.loads(Path(os.environ["REPOSITORY_METADATA"]).read_text(encoding="utf-8"))
          if not isinstance(repository_metadata, dict) or repository_metadata.get("full_name") != repository:
              raise SystemExit(f"Source run {source_run_id} returned invalid repository metadata")
          if repository_metadata.get("default_branch") != "main":
              raise SystemExit(f"Source run {source_run_id} repository does not use main as its default branch")
          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict) or head_repository.get("full_name") != repository:
              raise SystemExit(f"Source run {source_run_id} has an untrusted head repository")
          head_sha = run.get("head_sha")
          if not isinstance(head_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit(f"Source run {source_run_id} returned an invalid head SHA")

          pages = json.loads(Path(os.environ["JOBS_METADATA"]).read_text(encoding="utf-8"))
          if not isinstance(pages, list) or not pages:
              raise SystemExit(f"Source run {source_run_id} returned no job pages")
          jobs = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(page.get("jobs"), list):
                  raise SystemExit(f"Source run {source_run_id} returned invalid job metadata")
              if not all(isinstance(job, dict) for job in page["jobs"]):
                  raise SystemExit(f"Source run {source_run_id} returned an invalid job")
              jobs.extend(page["jobs"])
          for job_name in ("build", "publish-pypi", "verify-pypi"):
              matching = [job for job in jobs if job.get("name") == job_name]
              if len(matching) != 1:
                  raise SystemExit(f"Source run {source_run_id} must contain exactly one {job_name} job")
              job = matching[0]
              if job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit(f"Source run {source_run_id} {job_name} job did not complete successfully")
          print(head_sha)
          PY
          )

          gh api "repos/${GITHUB_REPOSITORY}/compare/${source_head_sha}...main" > "$compare_metadata"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit_sha}...main" > "$tag_compare_metadata"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit_sha}...${source_head_sha}" > "$source_relation_metadata"
          export COMPARE_METADATA="$compare_metadata"
          export TAG_COMPARE_METADATA="$tag_compare_metadata"
          export SOURCE_RELATION_METADATA="$source_relation_metadata"
          export SOURCE_HEAD_SHA="$source_head_sha"
          export TAG_COMMIT_SHA="$tag_commit_sha"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_head_sha = os.environ["SOURCE_HEAD_SHA"]
          tag_commit_sha = os.environ["TAG_COMMIT_SHA"]
          for label, expected_sha, metadata_path in (
              (f"Source run {source_run_id}", source_head_sha, os.environ["COMPARE_METADATA"]),
              ("Tagged root release", tag_commit_sha, os.environ["TAG_COMPARE_METADATA"]),
              ("Tagged root release relative to source run", tag_commit_sha, os.environ["SOURCE_RELATION_METADATA"]),
          ):
              comparison = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
              if not isinstance(comparison, dict):
                  raise SystemExit(f"{label} returned invalid branch comparison metadata")
              if comparison.get("status") not in {"ahead", "identical"}:
                  raise SystemExit(f"{label} does not belong to protected main history")
              behind_by = comparison.get("behind_by")
              if not isinstance(behind_by, int) or isinstance(behind_by, bool) or behind_by != 0:
                  raise SystemExit(f"{label} is not an ancestor of protected main")
              merge_base = comparison.get("merge_base_commit")
              if not isinstance(merge_base, dict) or merge_base.get("sha") != expected_sha:
                  raise SystemExit(f"{label} has an untrusted merge base")

          source_relation = json.loads(Path(os.environ["SOURCE_RELATION_METADATA"]).read_text(encoding="utf-8"))
          changed_files = source_relation.get("files")
          allowed_source_changes = {".github/workflows/release-please.yml", "tests/test_release_workflow.py"}
          if not isinstance(changed_files, list) or len(changed_files) > len(allowed_source_changes):
              raise SystemExit("Tagged root release and source run returned invalid changed-file metadata")
          if not all(
              isinstance(entry, dict) and entry.get("filename") in allowed_source_changes for entry in changed_files
          ):
              raise SystemExit("Tagged root release and source run differ outside the trusted release-repair files")
          print(
              f"Verified original modelaudit publish run {source_run_id} at {source_head_sha} "
              f"and tagged root release at {tag_commit_sha}"
          )
          PY
          {
            echo "source_head_sha=$source_head_sha"
            echo "tag_commit_sha=$tag_commit_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download original root build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-please.outputs.root_provenance_run_id }}

      - name: Verify recovered root artifacts match PyPI
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import posixpath
          import re
          import tarfile
          import unicodedata
          import urllib.request
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          version = os.environ["EXPECTED_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Invalid root release version: {version!r}")

          max_metadata_bytes = 10 * 1024 * 1024
          max_sdist_members = 10_000
          max_sdist_member_bytes = 16 * 1024 * 1024
          max_sdist_bytes = 256 * 1024 * 1024
          tagged_metadata = {}
          for filename in ("pyproject.toml", "uv.lock"):
              tagged_path = Path(filename)
              tagged_size = tagged_path.stat().st_size
              if tagged_size > max_metadata_bytes:
                  raise SystemExit(f"Tagged root {filename} exceeds {max_metadata_bytes} bytes")
              tagged_content = tagged_path.read_bytes()
              if len(tagged_content) != tagged_size:
                  raise SystemExit(f"Tagged root {filename} changed while it was being read")
              tagged_metadata[filename] = tagged_content

          project = tomllib.loads(tagged_metadata["pyproject.toml"].decode("utf-8"))["project"]
          if project.get("name") != "modelaudit" or project.get("version") != version:
              raise SystemExit(f"Tagged root project does not match modelaudit {version}: {project!r}")

          expected = {f"modelaudit-{version}-py3-none-any.whl", f"modelaudit-{version}.tar.gz"}
          paths = list(Path("dist").iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit(f"Expected exactly the root wheel and sdist, found {[path.name for path in paths]!r}")

          with urllib.request.urlopen(f"https://pypi.org/pypi/modelaudit/{version}/json", timeout=20) as response:
              payload = json.load(response)
          if payload.get("info", {}).get("version") != version:
              raise SystemExit(f"PyPI returned an unexpected modelaudit version for {version}")

          urls = payload.get("urls", [])
          published = {entry.get("filename"): entry for entry in urls}
          if len(published) != len(urls) or set(published) != expected:
              raise SystemExit(f"PyPI files for modelaudit {version} do not match {sorted(expected)!r}")

          for path in paths:
              entry = published[path.name]
              if entry.get("yanked", False):
                  raise SystemExit(f"Refusing to attest yanked PyPI artifact {path.name}")
              expected_digest = entry.get("digests", {}).get("sha256")
              digest = hashlib.sha256()
              with path.open("rb") as artifact_file:
                  for chunk in iter(lambda: artifact_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual_digest = digest.hexdigest()
              if not isinstance(expected_digest, str) or not re.fullmatch(r"[0-9a-f]{64}", expected_digest):
                  raise SystemExit(f"PyPI did not return a valid SHA256 for {path.name}")
              if actual_digest != expected_digest:
                  raise SystemExit(
                      f"Recovered artifact SHA256 mismatch for {path.name}: {actual_digest} != {expected_digest}"
                  )
              print(f"Verified {path.name}: {actual_digest}")

          required_members = {
              f"modelaudit-{version}/{filename}": content for filename, content in tagged_metadata.items()
          }
          normalized_required_members = {
              unicodedata.normalize("NFC", unicodedata.normalize("NFC", name).casefold()): name
              for name in required_members
          }
          seen_members = set()
          seen_paths = set()
          seen_files = set()
          seen_parent_paths = set()
          member_count = 0
          declared_size = 0
          try:
              with tarfile.open(Path("dist", f"modelaudit-{version}.tar.gz"), "r|gz") as archive:
                  for member in archive:
                      member_count += 1
                      if member_count > max_sdist_members:
                          raise SystemExit(f"Root sdist exceeds {max_sdist_members} members")
                      if member.size < 0 or member.size > max_sdist_member_bytes:
                          raise SystemExit(f"Root sdist member has an unsafe size: {member.name}")
                      declared_size += member.size
                      if declared_size > max_sdist_bytes:
                          raise SystemExit(f"Root sdist exceeds {max_sdist_bytes} declared bytes")
                      if member.issym() or member.islnk():
                          raise SystemExit(f"Root sdist contains a linked member: {member.name}")
                      if not member.isreg() and not member.isdir():
                          raise SystemExit(f"Root sdist contains a non-file member: {member.name}")
                      member_name = member.name.removesuffix("/") if member.isdir() else member.name
                      member_parts = member_name.split("/")
                      if (
                          member.name.startswith("/")
                          or re.match(r"^[A-Za-z]:", member.name)
                          or "\\" in member.name
                          or any(part in {"", ".", ".."} for part in member_parts)
                          or any(part.endswith((".", " ")) or ":" in part for part in member_parts)
                      ):
                          raise SystemExit(f"Root sdist contains an unsafe member path: {member.name}")
                      normalized_name = unicodedata.normalize(
                          "NFC", unicodedata.normalize("NFC", posixpath.normpath(member.name)).casefold()
                      )
                      canonical_name = normalized_required_members.get(normalized_name)
                      if canonical_name is not None and member.name != canonical_name:
                          raise SystemExit(f"Root sdist contains a metadata path alias: {member.name}")
                      if normalized_name in seen_paths:
                          raise SystemExit(f"Root sdist contains a duplicate or case-normalized path: {member.name}")
                      normalized_parts = normalized_name.split("/")
                      parent_paths = {
                          "/".join(normalized_parts[:index]) for index in range(1, len(normalized_parts))
                      }
                      if parent_paths & seen_files or member.isreg() and normalized_name in seen_parent_paths:
                          raise SystemExit(f"Root sdist contains a file/directory path conflict: {member.name}")
                      seen_paths.add(normalized_name)
                      seen_parent_paths.update(parent_paths)
                      if member.isreg():
                          seen_files.add(normalized_name)
                      expected_content = required_members.get(member.name)
                      if expected_content is None:
                          continue
                      if member.name in seen_members:
                          raise SystemExit(f"Duplicate root metadata member in sdist: {member.name}")
                      seen_members.add(member.name)
                      if not member.isreg():
                          raise SystemExit(f"Root metadata member is not a regular file: {member.name}")
                      if member.size > max_metadata_bytes or member.size != len(expected_content):
                          raise SystemExit(f"Root metadata member has an unexpected size: {member.name}")
                      member_file = archive.extractfile(member)
                      if member_file is None or member_file.read(member.size + 1) != expected_content:
                          raise SystemExit(f"Root metadata member does not match the release tag: {member.name}")
          except (OSError, tarfile.TarError) as error:
              raise SystemExit(f"Could not verify root sdist metadata: {error}") from error

          if seen_members != set(required_members):
              missing = sorted(set(required_members) - seen_members)
              raise SystemExit(f"Root sdist is missing tagged metadata: {missing!r}")
          PY

      - name: Generate recovery integrity attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/modelaudit-${{ needs.release-please.outputs.version }}-py3-none-any.whl
            dist/modelaudit-${{ needs.release-please.outputs.version }}.tar.gz
          predicate-type: https://promptfoo.dev/modelaudit/attestations/recovery/v1
          predicate: >-
            {"package":"modelaudit","version":"${{ needs.release-please.outputs.version }}","tag":"${{ needs.release-please.outputs.tag_name }}","source_run_id":"${{ needs.release-please.outputs.root_provenance_run_id }}","source_commit":"${{ steps.verify-source.outputs.source_head_sha }}","tag_commit":"${{ steps.verify-source.outputs.tag_commit_sha }}","pypi_json_url":"https://pypi.org/pypi/modelaudit/${{ needs.release-please.outputs.version }}/json"}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Generate SBOM from tagged root lockfile
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          uv export \
            --frozen \
            --no-dev \
            --preview-features sbom-export \
            --format cyclonedx1.5 \
            --output-file "dist/modelaudit-${EXPECTED_VERSION}.cdx.json" \
            > /dev/null
          echo "SBOM generated:"
          ls -la dist/*.cdx.json

      - name: Upload recovered root artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$ROOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$ROOT_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  picklescan-provenance:
    if: needs.release-please.outputs.picklescan_release_created == 'true'
    needs: [build-picklescan-package, publish-picklescan-pypi, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            packages/modelaudit-picklescan/pyproject.toml
            packages/modelaudit-picklescan/uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Download standalone pickle package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: modelaudit-picklescan-dist-*
          path: dist/
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "dist/*"

      - name: Generate standalone package SBOM
        working-directory: packages/modelaudit-picklescan
        run: |
          uv export \
            --frozen \
            --no-dev \
            --preview-features sbom-export \
            --format cyclonedx1.5 \
            --output-file ../../dist/modelaudit-picklescan-${{ needs.release-please.outputs.picklescan_version }}.cdx.json \
            > /dev/null
          echo "Standalone package SBOM generated:"
          ls -la ../../dist/*.cdx.json

      - name: Upload standalone artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.picklescan_tag_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
