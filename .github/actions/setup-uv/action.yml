name: Setup uv
description: Bootstrap uv with an official GitHub action and pip.

inputs:
  python-version:
    description: Bootstrap Python version used to install uv.
    required: false
    default: "3.12"
  uv-version:
    description: uv version to install for CI jobs.
    required: false
    default: "0.9.17"
  enable-cache:
    description: Compatibility input for previous workflow calls.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup bootstrap Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: python -m pip install --disable-pip-version-check "uv==${{ inputs.uv-version }}"
