[package]
name = "modelaudit-picklescan-rust"
version = "0.1.6" # x-release-please-version
edition = "2021"
rust-version = "1.83"
description = "Native pickle security scanner engine for modelaudit-picklescan"
license = "MIT"
repository = "https://github.com/promptfoo/modelaudit"
publish = false

[lib]
name = "modelaudit_picklescan_rust"
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py310"]

[dependencies]
pyo3 = { version = "0.29.0" }
