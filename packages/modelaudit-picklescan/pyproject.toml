[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "modelaudit-picklescan"
version = "0.1.0"
description = "Standalone pickle security scanner extracted from ModelAudit"
authors = [
    { name = "Ian Webster", email = "ian@promptfoo.dev" },
    { name = "Michael D'Angelo", email = "michael@promptfoo.dev" },
    { name = "Yash Chhabria", email = "yash@promptfoo.dev" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["pickle", "security", "model-scanning", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/modelaudit_picklescan"]
